name: Publish to NuGet

# Runs when a GitHub release is published, or manually ("Run workflow") for an existing release tag.
# The tag must be "v" + <Version> from the csproj.
# Authentication uses nuget.org Trusted Publishing (GitHub OIDC), so no API key is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v1.0.2
        required: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # OIDC token for nuget.org Trusted Publishing
      contents: write   # attach the package to the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check that the release tag matches the project version
        run: |
          version=$(dotnet msbuild QrCodeGenerator/QrCodeGenerator.csproj -getProperty:Version)
          echo "Project version: $version, release tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match project version v$version"
            exit 1
          fi

      - name: Build
        run: dotnet build QrCodeGenerator.slnx -c Release

      - name: Test (net10.0 build)
        run: dotnet test QrCodeGenerator.slnx -c Release --no-build

      - name: Test (netstandard2.1 build)
        run: dotnet test QrCodeGenerator.Tests -c Release -p:LibTfm=netstandard2.1

      - name: Pack
        run: dotnet pack QrCodeGenerator/QrCodeGenerator.csproj -c Release -o artifacts

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ppmetz

      # No --skip-duplicate: any rejection by nuget.org must fail the run and show the server's reason.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --verbosity detailed

      - name: Attach package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/*.nupkg artifacts/*.snupkg --clobber
