name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build QrCodeGenerator.slnx -c Release

      - name: Test (net10.0 build)
        run: dotnet test QrCodeGenerator.slnx -c Release --no-build

      - name: Test (netstandard2.1 build)
        run: dotnet test QrCodeGenerator.Tests -c Release -p:LibTfm=netstandard2.1
